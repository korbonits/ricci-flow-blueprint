name: blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz && ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean
        run: |
          lake exe cache get || true
          lake build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev texlive-full
          pip install leanblueprint

      - name: Build blueprint
        run: |
          leanblueprint pdf
          leanblueprint web
          leanblueprint checkdecls
          # plasTeX writes to blueprint/web (plastex.cfg `directory=../web/`,
          # resolved from blueprint/src). Ship the pdf alongside the site.
          cp blueprint/print/print.pdf blueprint/web/blueprint.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
