name: blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The TeX distribution used for `leanblueprint pdf` (xelatex + latexmk). A fixed TinyTeX
  # bundle downloads in seconds and is what the PDF is verified against locally;
  # `texlive-full` took longer to install than the Lean build.
  TINYTEX_URL: https://github.com/rstudio/tinytex-releases/releases/download/v2026.09/TinyTeX-v2026.09.tar.gz

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz && ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache project oleans
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('RicciFlowBlueprint/**/*.lean', 'RicciFlowBlueprint.lean') }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get mathlib cache
        # A cache miss must fail here, not fall through to building mathlib from source.
        run: |
          lake exe cache get
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Build Lean (warnings are errors)
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -q '^warning:' build.log; then
            echo '::error::lake build produced warnings'; exit 1
          fi

      - name: Check axioms
        # Every declaration the blueprint points at rests on propext, Classical.choice,
        # Quot.sound only, and the project declares no axioms of its own. `sorry` is
        # already caught above (it is a warning).
        run: python3 scripts/check_axioms.py

      - name: Save project oleans
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('RicciFlowBlueprint/**/*.lean', 'RicciFlowBlueprint.lean') }}

  blueprint:
    # Runs on pull requests too: a wrong `\lean{}` name, an undefined macro or a TeX error
    # fails the PR, not the deploy after the merge.
    needs: lean
    runs-on: ubuntu-latest
    concurrency:
      group: blueprint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz && ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore project oleans
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('RicciFlowBlueprint/**/*.lean', 'RicciFlowBlueprint.lean') }}

      - name: Build Lean
        run: |
          lake exe cache get
          lake build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev
          pip install leanblueprint

      - name: Install TeX (TinyTeX)
        run: |
          mkdir -p "$HOME/tinytex"
          curl -sSfL "$TINYTEX_URL" | tar xz -C "$HOME/tinytex"
          echo "$HOME/tinytex/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Build blueprint
        run: |
          leanblueprint pdf
          # A missing glyph is not a LaTeX error: it is silently dropped from the PDF.
          # Fail on it, and on any error the log records.
          if grep -q 'Missing character' blueprint/print/print.log; then
            grep 'Missing character' blueprint/print/print.log | sort -u
            echo '::error::the PDF is missing glyphs (use math mode for subscripts in \texttt)'; exit 1
          fi
          if grep -q '^!' blueprint/print/print.log; then
            grep -A3 '^!' blueprint/print/print.log
            echo '::error::LaTeX reported errors'; exit 1
          fi
          leanblueprint web
          leanblueprint checkdecls
          # plasTeX writes to blueprint/web (plastex.cfg `directory=../web/`,
          # resolved from blueprint/src). Ship the pdf alongside the site.
          cp blueprint/print/print.pdf blueprint/web/blueprint.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: blueprint/web

  deploy:
    needs: blueprint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
